# WHM AppConfig for Worker Supervisor, registered by install.sh with register_appconfig.
name=worker_supervisor
service=whostmgr
user=root
url=/cgi/worker_supervisor/
# "all" is also held by resellers granted every privilege: the pages check REMOTE_USER is root.
acls=all
displayname=Worker Supervisor
entryurl=worker_supervisor/index.php
icon=worker_supervisor.png
target=_self
